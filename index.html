  <!-- Hairline Burnished-Copper Film Progress Bar Along Viewport Bottom -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-x-0 bottom-0 z-30 h-[2.5px] bg-forest/10">
    <div id="video-progress" class="h-full w-full origin-left scale-x-0 bg-copper transition-none"></div>
  </div>

  <!-- ===================================================================== -->
  <!-- BACKGROUND VIDEO CONTROLLER & CLIPBOARD                               -->
  <!-- ===================================================================== -->
  <script>
    (function () {
      'use strict';

      const video = document.getElementById('intro-video');
      const soundBtn = document.getElementById('sound-btn');
      const soundLabel = document.getElementById('sound-label');
      const replayBtn = document.getElementById('replay-btn');
      const stageTapZone = document.getElementById('stage-tap-zone');
      const fallbackPlay = document.getElementById('fallback-play');
      const progressBar = document.getElementById('video-progress');

      let holdTimer = null;

      function syncSoundUI() {
        if (!video || !soundBtn || !soundLabel) return;
        if (video.muted) {
          soundBtn.classList.remove('is-unmuted');
          soundLabel.textContent = 'Sound off';
        } else {
          soundBtn.classList.add('is-unmuted');
          soundLabel.textContent = 'Sound on';
        }
      }

      function toggleSound() {
        if (!video) return;
        clearTimeout(holdTimer);
        if (video.muted) {
          video.muted = false;
          if (video.ended || (video.duration && video.currentTime > video.duration - 1.2)) {
            video.currentTime = 0;
          }
          video.play().catch(function () {});
        } else {
          video.muted = true;
        }
        syncSoundUI();
      }

      if (video) {
        const playPromise = video.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function () {
            if (fallbackPlay) {
              fallbackPlay.classList.remove('hidden');
              fallbackPlay.classList.add('inline-flex');
            }
          });
        }

        video.addEventListener('play', function () {
          if (fallbackPlay) {
            fallbackPlay.classList.add('hidden');
            fallbackPlay.classList.remove('inline-flex');
          }
        });

        // Hold 3.5s on the resolved RX reveal frame at the end before seamlessly replaying
        video.addEventListener('ended', function () {
          if (progressBar) progressBar.style.transform = 'scaleX(1)';
          clearTimeout(holdTimer);
          holdTimer = setTimeout(function () {
            video.currentTime = 0;
            video.play().catch(function () {});
          }, 3500);
        });
      }

      if (stageTapZone && video) {
        stageTapZone.addEventListener('click', function () {
          if (video.paused && !video.ended) {
            video.play().catch(function () {});
          } else {
            toggleSound();
          }
        });
      }

      if (fallbackPlay && video) {
        fallbackPlay.addEventListener('click', function (e) {
          e.stopPropagation();
          video.muted = false;
          video.play().catch(function () {
            video.muted = true;
            video.play().catch(function () {});
          });
          syncSoundUI();
        });
      }

      if (soundBtn) {
        soundBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          toggleSound();
        });
      }

      if (replayBtn && video) {
        replayBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          clearTimeout(holdTimer);
          video.currentTime = 0;
          video.play().catch(function () {});
        });
      }

      function updateProgress() {
        if (video && progressBar && video.duration > 0) {
          const ratio = Math.min(1, Math.max(0, video.currentTime / video.duration));
          progressBar.style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
        }
        requestAnimationFrame(updateProgress);
      }
      requestAnimationFrame(updateProgress);
    })();
  </script>
